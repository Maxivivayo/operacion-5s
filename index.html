<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Operación 5S · Planta en Caos</title>
<style>
:root{--bg:#08111f;--panel:#101c2f;--panel2:#15243b;--text:#f7fafc;--muted:#a9b7c9;--accent:#60a5fa;--ok:#34d399;--warn:#fbbf24;--danger:#fb7185;--line:#263852}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:radial-gradient(circle at 20% 0%,#172c4d 0,#08111f 45%);color:var(--text);min-height:100vh}
button{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 28px;border-bottom:1px solid var(--line);background:#08111fcc;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:14px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#60a5fa,#34d399);display:grid;place-items:center;font-weight:900;color:#07111e}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px}.ghost{background:transparent;color:var(--text);border:1px solid var(--line);padding:10px 13px;border-radius:12px;cursor:pointer}.ghost:hover{background:#ffffff0b}
.main{display:grid;grid-template-columns:270px 1fr;min-height:0}.side{padding:20px 16px;border-right:1px solid var(--line);background:#0a1423aa}.side h2{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 8px 12px}.stepbtn{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--muted);padding:12px;border-radius:14px;margin:4px 0;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}.stepbtn:hover{background:#ffffff08}.stepbtn.active{background:#15243b;color:#fff;border-color:#2b4261}.num{width:30px;height:30px;border-radius:10px;border:1px solid #39506f;display:grid;place-items:center;font-weight:800}.stepbtn.active .num{background:var(--accent);border-color:var(--accent);color:#06111f}.stepbtn small{display:block;color:#8fa1b8;margin-top:2px}
.content{padding:34px clamp(24px,5vw,70px);display:flex;flex-direction:column;justify-content:center;min-width:0}.kicker{text-transform:uppercase;letter-spacing:.18em;font-weight:800;color:var(--accent);font-size:13px}.title{font-size:clamp(36px,5vw,68px);line-height:.98;margin:10px 0 18px;max-width:1050px}.desc{font-size:clamp(18px,2vw,25px);line-height:1.45;color:#d8e2ee;max-width:1050px;margin:0 0 24px}.mission{border-left:5px solid var(--accent);background:linear-gradient(90deg,#60a5fa18,transparent);padding:17px 20px;border-radius:0 14px 14px 0;max-width:1050px;font-size:clamp(17px,1.7vw,22px);line-height:1.45}.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:1050px;margin-top:22px}.rule{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px}.rule b{display:block;margin-bottom:4px}.rule span{color:var(--muted);font-size:14px;line-height:1.35}
.timerbox{margin-top:28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(64px,10vw,132px);line-height:.8;letter-spacing:-.05em}.timer.warn{color:var(--warn)}.timer.danger{color:var(--danger)}.controls{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary,.dangerbtn{border:0;padding:13px 18px;border-radius:13px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#06111f}.secondary{background:#233754;color:#fff}.dangerbtn{background:#4b1f2b;color:#ffdce4}.primary:hover,.secondary:hover,.dangerbtn:hover{filter:brightness(1.08)}
.progress{height:5px;background:#15243b}.bar{height:100%;width:0;background:linear-gradient(90deg,#60a5fa,#34d399);transition:width .25s}.bottom{padding:12px 28px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;border-top:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:#030712ee;display:none;place-items:center;padding:30px;z-index:20;text-align:center}.overlay.show{display:grid}.overlay h2{font-size:clamp(48px,8vw,100px);margin:0 0 15px}.overlay p{font-size:24px;color:#cbd5e1;max-width:800px}.overlay button{margin-top:20px}
@media(max-width:850px){.main{grid-template-columns:1fr}.side{display:none}.rules{grid-template-columns:1fr}.top{padding:14px}.content{padding:24px}.bottom{padding:10px 14px}.title{font-size:42px}}
@media print{.side,.top-actions,.controls,.bottom,.progress{display:none!important}.main{display:block}.content{padding:20px}.timerbox{display:none}.top{border:0}.app{display:block}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">5S</div><div><h1>Operación 5S · Planta en Caos</h1><p>Guía proyectable para conducir la actividad</p></div></div><div class="top-actions"><button class="ghost" id="fs">⛶ Pantalla completa</button><button class="ghost" id="sound">🔊 Sonido: sí</button></div></header>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="main"><aside class="side"><h2>Etapas</h2><div id="steps"></div></aside><main class="content">
<div class="kicker" id="kicker"></div><h2 class="title" id="title"></h2><p class="desc" id="desc"></p><div class="mission" id="mission"></div><div class="rules" id="rules"></div>
<div class="timerbox"><div class="timer" id="timer">--:--</div><div class="controls"><button class="primary" id="start">▶ Iniciar</button><button class="secondary" id="reset">↺ Reiniciar</button><button class="secondary" id="prev">← Anterior</button><button class="secondary" id="next">Siguiente →</button></div></div>
</main></div><footer class="bottom"><span>Docente: avance una etapa por vez. El cronómetro no inicia automáticamente.</span><span>Teclas: Espacio = iniciar/pausar · ←/→ = cambiar etapa · R = reiniciar</span></footer>
</div>
<div class="overlay" id="overlay"><div><h2>⏱ Tiempo</h2><p id="overlayText">Finalizó la etapa.</p><button class="primary" id="closeOverlay">Continuar</button></div></div>
<script>
const stages=[
 {k:'Inicio',t:'Misión: transformar un puesto en caos',d:'Cada equipo representa un grupo de mejora continua. Todos reciben el mismo puesto de trabajo y deberán intervenirlo aplicando progresivamente las 5S.',m:'No buscamos una única solución correcta. Cada decisión debe poder justificarse con criterios de seguridad, eficiencia, necesidad y sostenibilidad.',mins:0,r:[['7 equipos','Aproximadamente 5 integrantes por equipo.'],['Mismo escenario','Permite comparar decisiones al finalizar.'],['Regla clave','No abrir ni utilizar material de etapas futuras hasta que se indique.']]},
 {k:'1 · SEIRI',t:'Clasificar: ¿qué necesitamos realmente?',d:'Revisen las 30 tarjetas del puesto y decidan qué elementos deben permanecer, cuáles deben retirarse y cuáles requieren información adicional.',m:'Tienen 3 minutos para clasificar todo en NECESARIO, INNECESARIO o DUDA. Solo pueden dejar un máximo de 3 elementos en DUDA.',mins:3,r:[['Necesario','Aporta valor o es requerido para realizar el trabajo.'],['Innecesario','Debe retirarse, descartarse, reubicarse o gestionarse.'],['Duda','No alcanza la información disponible. Deberán justificar por qué.']]},
 {k:'2 · SEITON',t:'Ordenar: un lugar para cada cosa',d:'Trabajen únicamente con los elementos que decidieron conservar. Ubíquenlos en el plano del puesto de trabajo.',m:'Tienen 4 minutos. Definan qué debe estar al alcance inmediato, qué puede almacenarse, qué necesita identificación y qué ubicación debería quedar señalizada.',mins:4,r:[['Frecuencia','¿Cuánto se utiliza cada elemento?'],['Acceso y seguridad','¿Dónde conviene ubicarlo para trabajar mejor?'],['Gestión visual','¿Puede reconocerse rápidamente dónde pertenece?']]},
 {k:'3 · SEISO',t:'Limpiar también es inspeccionar',d:'Ahora recibirán 5 hallazgos detectados durante la limpieza del puesto. Analicen cada situación antes de responder.',m:'Tienen 3 minutos. Para cada hallazgo indiquen una acción inmediata y qué debería investigarse. “Limpiar” por sí solo no resuelve el desafío.',mins:3,r:[['Observar','¿Qué anomalía está haciendo visible la limpieza?'],['Actuar','¿Qué harían inmediatamente?'],['Investigar','¿Cuál podría ser la causa o qué información necesitan?']]},
 {k:'4 · SEIKETSU',t:'Estandarizar: que el estado correcto sea visible',d:'Mañana ingresa una persona nueva al puesto. Sin hablar con ustedes, debería poder reconocer cómo debe mantenerse.',m:'Tienen 4 minutos. Elijan como máximo 5 recursos o estándares visuales y expliquen qué problema evita cada uno.',mins:4,r:[['Límite','Máximo 5 recursos: deben priorizar.'],['Ejemplos','Etiquetas, demarcaciones, fotografías, códigos, checklist…'],['Pregunta guía','¿Cómo sabrá alguien cuál es el estado correcto?']]},
 {k:'5 · SHITSUKE',t:'Sostener: tres meses después…',d:'Pasaron tres meses y el puesto comienza a desordenarse nuevamente. El desafío ahora es evitar que 5S sea una acción de una sola vez.',m:'Tienen 3 minutos. Definan 2 mecanismos concretos para sostener el sistema e indiquen responsable, frecuencia y forma de verificación.',mins:3,r:[['Concreto','Eviten respuestas generales como “capacitar”.'],['Gestión','Piensen en auditorías, responsables, indicadores o seguimiento.'],['Sostenibilidad','¿Cómo detectarían que el estándar empieza a perderse?']]},
 {k:'Cierre · Auditoría',t:'Auditoría cruzada',d:'Dejen su puesto como está y pasen al puesto del equipo siguiente. Ahora dejan de diseñar y pasan a auditar.',m:'Tienen 3 minutos. Marquen CUMPLE, DUDOSO o DESVÍO. No pueden modificar nada. Todo DUDOSO o DESVÍO debe incluir una justificación.',mins:3,r:[['Cumple','El criterio está claro y es coherente.'],['Dudoso','Falta información o justificación.'],['Desvío','Se observa una condición contraria a los principios 5S.']]},
 {k:'Puesta en común',t:'Puesta en común relámpago',d:'Miren el puesto que auditaron y comparen una decisión concreta con la que tomó su propio equipo. No vamos a exponer todas las soluciones: seleccionaremos solo algunos casos diferentes.',m:'Identifiquen UNA decisión en la que su equipo y el equipo auditado hayan actuado diferente. Los equipos seleccionados tendrán 30 segundos cada uno para explicar: ¿qué decidieron y por qué?',mins:0,r:[['1 · Detectar','Levanten la mano si encontraron una decisión diferente a la de su equipo.'],['2 · Comparar','En los casos seleccionados, cada equipo explica su criterio en 30 segundos.'],['3 · Concluir','No buscamos una única solución: comparamos los criterios utilizados.']]}
];
let idx=0,left=0,total=0,interval=null,running=false,soundOn=true;
const $=id=>document.getElementById(id), steps=$('steps'),timer=$('timer');
function renderSteps(){steps.innerHTML='';stages.forEach((s,i)=>{const b=document.createElement('button');b.className='stepbtn'+(i===idx?' active':'');b.innerHTML=`<span class="num">${i===0?'★':i===stages.length-1?'✓':i}</span><span><b>${s.k}</b><small>${s.mins?s.mins+' min':'sin tiempo'}</small></span>`;b.onclick=()=>go(i);steps.appendChild(b)})}
function render(){const s=stages[idx];$('kicker').textContent=s.k;$('title').textContent=s.t;$('desc').textContent=s.d;$('mission').innerHTML='<b>Consigna:</b> '+s.m;$('rules').innerHTML=s.r.map(x=>`<div class="rule"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');total=s.mins*60;left=total;updateTimer();const hasTimer=!!s.mins;$('start').style.display=hasTimer?'inline-block':'none';$('reset').style.display=hasTimer?'inline-block':'none';$('start').disabled=false;$('start').textContent='▶ Iniciar';running=false;clearInterval(interval);$('bar').style.width=((idx)/(stages.length-1)*100)+'%';renderSteps()}
function updateTimer(){if(!total){timer.textContent='GUÍA';timer.className='timer';return}let m=Math.floor(left/60),s=left%60;timer.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;timer.className='timer'+(left<=30?' danger':left<=60?' warn':'')}
function beep(freq=660,dur=.16){if(!soundOn)return;try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;g.gain.value=.07;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur)}catch(e){}}
function toggle(){if(!total)return;if(running){clearInterval(interval);running=false;$('start').textContent='▶ Continuar';return}running=true;$('start').textContent='⏸ Pausar';beep(520,.1);interval=setInterval(()=>{left--;updateTimer();if(left<=0){clearInterval(interval);running=false;left=0;updateTimer();beep(880,.2);setTimeout(()=>beep(880,.2),250);$('overlayText').textContent=`Finalizó ${stages[idx].k}. Cerrá este aviso y continuá con la siguiente etapa cuando estés listo.`;$('overlay').classList.add('show');$('start').textContent='▶ Iniciar'}},1000)}
function go(i){if(i<0||i>=stages.length)return;idx=i;render()}
$('start').onclick=toggle;$('reset').onclick=()=>{clearInterval(interval);running=false;left=total;updateTimer();$('start').textContent='▶ Iniciar'};$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);$('closeOverlay').onclick=()=>$('overlay').classList.remove('show');$('fs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sonido: sí':'🔇 Sonido: no'};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1);if(e.key.toLowerCase()==='r')$('reset').click();if(e.key==='Escape')$('overlay').classList.remove('show')});
render();
</script>
</body></html>
